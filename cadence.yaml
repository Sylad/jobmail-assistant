# Documentation qui suit le code (cadence docs.sync, L307 de cadence, 24-10) : raf check et la revue signalent un lot dont le code laisse sa doc en retard ; docs.articles = étude de cas du projet dans claude-code-codex (le bibliothécaire propose un lot là-bas).
docs:
  sync:
    # Paquet Python (CLI, pipeline, mail, extraction, cleaner, web FastAPI) : « How it works », « Web UI », « Mailbox cleaner » et « Layout » du README, CLAUDE.md. Exclu : le JSON des Nouveautés généré.
    - paths: ['jobmail/**', '!jobmail/web/static/nouveautes-data/**']
      docs: [README.md, CLAUDE.md]
    # Îlot Vue du cleaner et extension Thunderbird : sections « Frontend assets », « Mailbox cleaner » et « Thunderbird » du README, README de l'extension.
    - paths: ['frontend/src/**', 'thunderbird-extension/**']
      docs: [README.md, thunderbird-extension/README.md]
  since: 2026-10-24
  articles:
    - repo: ../claude-code-codex
      file: frontend/src/pages/case-studies/jobmail-assistant.astro

# Porte de la vague (L12, 25-10) : la vague lance ces deux commandes après chaque écriture ; un rouge part en correction au lieu d'arriver dans main.
# test = pytest via le venv du projet, qui lance aussi la suite JavaScript (tests/test_js.py → node --test tests/js/*.test.mjs) ; il n'y a pas d'autre suite frontend (le package frontend/ n'a pas de script test). Aucun test ne touche les vrais MBOX Thunderbird ni Ollama : tests/conftest.py redirige DB, règles et globs MBOX vers un dossier temporaire avant l'import (tests/test_isolation.py le prouve) et les tests Ollama simulent le binaire ; rien à exclure. Vérifié vert sur main le 25-10 (pytest complet).
# build = ruff puis le build du frontend (vue-tsc --noEmit && vite build, écrit dans jobmail/web/static/assets). Vérifié vert sur main le 25-10.
# precheck: true = le contrôle préalable cherche si le lot est déjà livré, sur Sonnet.
orchestrate:
  # Escalade (L13, cadence L337 / 1.12.0) : avant de rendre un lot encore non conforme après ses passes, la vague joue
  # une correction et une revue neuve en Fable (règle du lead depuis le 17-10, oubliée deux fois à la main).
  escalation: { model: fable }
  test: .venv/bin/python -m pytest -q
  build: .venv/bin/ruff check . && npm --prefix frontend run build
  precheck: true

# tests/test_plan_web.py cite l'ancien emplacement du plan à dessein : ce sont des assertions que la page publique n'expose AUCUN chemin (l’ancien dossier du plan), pas des lecteurs du plan. Le vrai chemin y est corrigé à la main (REAL_PLAN).
migrate:
  keep: [tests/test_plan_web.py]
