[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobmail-assistant"
version = "0.1.0"
description = "Privacy-first local job-offer triage from IMAP/Thunderbird."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sylvain Ladoire" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "imap-tools>=1.7",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.55"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
jobmail = "jobmail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jobmail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
