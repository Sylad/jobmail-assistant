name: CI

# Tests et lint. jobmail tourne en local (WSL) : aucune image n'est construite
# ni publiée (l'ancienne étape build-push vers GHCR, rouge depuis le 28-09, est
# retirée — L11).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Node fait tourner tests/js/*.test.mjs via tests/test_js.py (sinon le test est sauté).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Même environnement et mêmes commandes que la porte de cadence run (orchestrate.build et
      # orchestrate.test de cadence.yaml, gardé par tests/test_analyse_config.py) : un venv .venv.
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Tests
        run: .venv/bin/python -m pytest -q
